name: Build FFmpeg Rockchip

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "8.0"]
    paths:
      - ".github/workflows/build-ffmpeg-rockchip.yml"
      - "ci/build_ffmpeg_rockchip.sh"
      - "configure"
      - "Makefile"
      - "compat/**"
      - "ffbuild/**"
      - "fftools/**"
      - "libavcodec/**"
      - "libavdevice/**"
      - "libavfilter/**"
      - "libavformat/**"
      - "libavutil/**"
      - "libswresample/**"
      - "libswscale/**"
  pull_request:
    paths:
      - ".github/workflows/build-ffmpeg-rockchip.yml"
      - "ci/build_ffmpeg_rockchip.sh"
      - "configure"
      - "Makefile"
      - "compat/**"
      - "ffbuild/**"
      - "fftools/**"
      - "libavcodec/**"
      - "libavdevice/**"
      - "libavfilter/**"
      - "libavformat/**"
      - "libavutil/**"
      - "libswresample/**"
      - "libswscale/**"

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    container:
      image: debian:bullseye
    strategy:
      fail-fast: false
      matrix:
        variant: [shared, static]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            yasm \
            nasm \
            curl \
            tar \
            meson \
            patchelf \
            file

      - name: Build ${{ matrix.variant }} package
        run: |
          ./ci/build_ffmpeg_rockchip.sh "${{ matrix.variant }}" 4

      - name: Smoke test package
        run: |
          set -euo pipefail
          tarball="$(ls dist/ffmpeg-rockchip-${{ matrix.variant }}-*.tar.gz | head -n1)"
          pkg_dir="$(tar -tf "${tarball}" | head -n1 | cut -d/ -f1)"
          tar -xf "${tarball}" -C dist
          dist/${pkg_dir}/bin/ffmpeg -version | head -n3
          dist/${pkg_dir}/bin/ffprobe -version | head -n3
          readelf -d dist/${pkg_dir}/bin/ffmpeg | grep -E 'RPATH|RUNPATH'
          if [ "${{ matrix.variant }}" = "static" ]; then
            if readelf -d dist/${pkg_dir}/bin/ffmpeg | grep -q 'librga.so'; then
              echo "static variant still depends on dynamic librga"
              exit 1
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-rockchip-${{ matrix.variant }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
